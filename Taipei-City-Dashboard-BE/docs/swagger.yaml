basePath: /api/v1
definitions:
  models.Dashboard:
    type: object
  models.Incident:
    properties:
      description:
        type: string
      distance:
        type: number
      id:
        type: integer
      inctype:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      place:
        type: string
      reportTime:
        type: string
      status:
        type: string
    type: object
  models.Issue:
    properties:
      context:
        type: string
      created_at:
        type: string
      decision_desc:
        type: string
      description:
        type: string
      id:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
host: localhost:8088
info:
  contact: {}
  description: Backend API for Taipei City Dashboard.
  title: Taipei City Dashboard API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Basic base64(email:password)
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login with email and password
      tags:
      - auth
  /chatlog:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Session ID
        in: formData
        name: session
        required: true
        type: string
      - description: User question
        in: formData
        name: question
        required: true
        type: string
      - description: AI answer
        in: formData
        name: answer
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a chat log entry
      tags:
      - chatlog
  /chatlog/session:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all chat log sessions
      tags:
      - chatlog
  /chatlog/session/{session}:
    get:
      parameters:
      - description: Session ID
        in: path
        name: session
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get chat log by session ID
      tags:
      - chatlog
  /component:
    get:
      parameters:
      - description: City (taipei, metrotaipei)
        in: query
        name: city
        type: string
      - description: Page size
        in: query
        name: pagesize
        type: integer
      - description: Page number
        in: query
        name: pagenum
        type: integer
      - description: Search by name
        in: query
        name: searchbyname
        type: string
      - description: Search by index
        in: query
        name: searchbyindex
        type: string
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all components
      tags:
      - component
  /component/{id}:
    delete:
      parameters:
      - description: Component ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete component
      tags:
      - component
    get:
      parameters:
      - description: Component ID
        in: path
        name: id
        required: true
        type: integer
      - description: City (taipei, metrotaipei)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get component by ID
      tags:
      - component
    patch:
      consumes:
      - application/json
      parameters:
      - description: Component ID
        in: path
        name: id
        required: true
        type: integer
      - description: City (taipei, metrotaipei)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update component config
      tags:
      - component
  /component/{id}/all:
    get:
      parameters:
