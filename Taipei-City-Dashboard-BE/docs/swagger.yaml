        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete dashboard
      tags:
      - dashboard
    get:
      parameters:
      - description: Dashboard index
        in: path
        name: index
        required: true
        type: string
      - description: City name (taipei, metrotaipei)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get dashboard by index
      tags:
      - dashboard
    patch:
      consumes:
      - application/json
      parameters:
      - description: Dashboard index
        in: path
        name: index
        required: true
