      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get component by ID (all cities)
      tags:
      - component
  /component/{id}/chart:
    get:
      parameters:
      - description: Component ID
        in: path
        name: id
        required: true
        type: integer
      - description: City (taipei, metrotaipei)
        in: query
        name: city
        type: string
      - description: Start time (RFC3339)
        in: query
        name: time_from
        type: string
      - description: End time (RFC3339)
        in: query
        name: time_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get component chart data
      tags:
      - component
  /component/{id}/history:
    get:
      parameters:
      - description: Component ID
        in: path
        name: id
        required: true
        type: integer
      - description: City (taipei, metrotaipei)
        in: query
        name: city
        type: string
      - description: Start time (RFC3339)
        in: query
        name: time_from
        required: true
        type: string
      - description: End time (RFC3339)
        in: query
        name: time_to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get component history data
      tags:
      - component
  /contributor:
    get:
      parameters:
      - description: Page size
        in: query
        name: pagesize
        type: integer
      - description: Page number
